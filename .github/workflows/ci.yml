name: CI

# Validates the repo on every push and PR. Deploy (deploy.yml) waits for this to
# go green. A failing lint / typecheck / test here blocks the deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {} # so deploy.yml can require this workflow as a gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint · typecheck · test
    runs-on: [self-hosted, linux, x64, jnpa-ec2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — pnpm/action-setup errors out ("Multiple versions of pnpm
          # specified") when it is set alongside package.json's `packageManager`, which is
          # the single source of truth for the pnpm version here and locally.
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile=false
      - name: Prettier check (web + mobile)
        run: pnpm format:check
      - name: Lint (web)
        run: pnpm --filter jnpa-uc3-dashboard lint
      - name: Typecheck (web)
        run: pnpm --filter jnpa-uc3-dashboard typecheck
      - name: Unit tests + coverage (web vitest)
        run: pnpm --filter jnpa-uc3-dashboard test -- --coverage

  mobile:
    name: mobile-pwa — lint · typecheck
    runs-on: [self-hosted, linux, x64, jnpa-ec2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — pnpm/action-setup errors out ("Multiple versions of pnpm
          # specified") when it is set alongside package.json's `packageManager`, which is
          # the single source of truth for the pnpm version here and locally.
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile=false
      - name: Lint (mobile-pwa)
        run: pnpm --filter jnpa-uc3-trucking-pwa lint
      - name: Typecheck (mobile-pwa)
        run: pnpm --filter jnpa-uc3-trucking-pwa typecheck

  python:
    name: python — pytest (shared + tests)
    runs-on: [self-hosted, linux, x64, jnpa-ec2]
    steps:
      - uses: actions/checkout@v4
      # Prefer the runner's system Python. actions/setup-python only ships builds for
      # a few OS images and fails on Amazon Linux even when python3.12 is installed.
      - name: Use system Python 3.12
        run: |
          if ! command -v python3.12 >/dev/null 2>&1; then
            echo "python3.12 not on PATH — install it on the self-hosted runner"
            exit 1
          fi
          python3.12 --version
          echo "PY=python3.12" >> "$GITHUB_ENV"
      - name: Install editable packages (every package the tests import)
        run: |
          $PY -m pip install --upgrade pip
          $PY -m pip install -e "shared[dev]"
          $PY -m pip install -e "ingest/vahan_sim[dev]" -e "ingest/vahan_live[dev]"
          $PY -m pip install -e "ingest/rfid[dev]"
          $PY -m pip install -e "ingest/trucking_app[dev]"
          # EIR / gate-slip OCR (tests/test_eir_ocr.py imports `eir_ocr`; the
          # tesseract-dependent cases are marked `integration` and skip here).
          $PY -m pip install -e "ingest/eir_ocr[dev]"
          $PY -m pip install -e "ai/anpr[dev]"
          $PY -m pip install -e "ai/congestion[dev]"
          $PY -m pip install -e "ai/anomaly[dev]"
          $PY -m pip install -e "gateway[dev]"
          $PY -m pip install -e "scenarios[dev]"
          # Appendix-C capability services (tests import these top-level modules).
          $PY -m pip install -e "empty-container[dev]"
          $PY -m pip install -e "gate-data[dev]"
          $PY -m pip install -e "carbon[dev]"
          $PY -m pip install -e "parking[dev]"
          $PY -m pip install -e "identity[dev]"
          $PY -m pip install pytest-cov
      - name: Pytest with coverage (torch-free path; model tests skip, gates enforce)
        run: |
          $PY -m pytest shared tests \
            --cov=shared/jnpa_shared --cov=ai --cov=gateway \
            --cov-report=term-missing -ra
      - name: Self-test (D.2 + Appendix-C demonstrability gates)
        run: $PY scripts/poc_selftest.py

  ci-ok:
    name: CI passed
    runs-on: [self-hosted, linux, x64, jnpa-ec2]
    needs: [web, mobile, python]
    steps:
      - run: echo "All CI jobs passed."
