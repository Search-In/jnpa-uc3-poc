# ============================================================================
# JNPA UC3 — AWS single-EC2 demo overlay.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
#
# Differences from local development:
#   • Exposes the `web` container (Vite/nginx) on port 80.
#   • Hides all host-side ports of messaging and API containers using !reset so
#     they only communicate inside the private jnpa bridge network.
#   • Applies `restart: unless-stopped` to all services for reboot survival.
#
# DATABASE: AWS RDS ONLY.
#   The local `postgres` container is NOT part of this stack. It lives in
#   docker-compose.yml behind the "localdb" profile (dev sandbox only) and this
#   overlay never enables that profile, so `up` here starts no database. Every
#   service reads POSTGRES_DSN / RFID_ / TRUCK_ / CONGESTION_ / ANOMALY_
#   *_POSTGRES_DSN from the env file and those must point at
#   database-1.c5gg8y8cyk0z.ap-south-1.rds.amazonaws.com:5432/jnpa_schema_v3.
#   The compose vars use the `${VAR:?…}` form, so a missing DSN aborts the
#   deployment instead of silently falling back to a local database.
# ============================================================================

services:
  web:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  # NOTE: no `postgres` entry here on purpose — the AWS stack runs against RDS
  # and must never start (or be able to fall back to) a local database.

  redis:
    ports: !reset []
    restart: unless-stopped

  zookeeper:
    restart: unless-stopped

  kafka:
    ports: !reset []
    restart: unless-stopped

