# QA nginx config for the JNPA UC-III dashboard.
#
# Plain HTTP on :3000 inside the container, published on host port 18080 by
# docker-compose.qa.yml (18080:3000) — the same container port the repo already
# uses for plain-HTTP nginx locally (web/nginx/default.local.conf). It is a line-for-line copy of the production config
# (web/nginx/default.conf) with ONLY the TLS/redirect server blocks removed —
# every location block, proxy header and cache rule is identical, so QA
# exercises the same routing as production.
#
# WHY NOT THE BAKED CONFIG: web/Dockerfile bakes default.conf, which listens on
# 80/443 and loads /etc/letsencrypt/live/traffic-three.searchintech.in/*. Those
# certificates belong to production and no QA hostname exists yet, so the QA
# container mounts this file over the baked one (docker-compose.qa.yml).
#
# /api AND /api/ws PROXY TO THE QA GATEWAY, NEVER PRODUCTION'S: `gateway` is
# resolved per-request through Docker's embedded DNS on the QA project network
# (jnpa-uc3-poc-qa_jnpa), where the only container answering to that name is
# jnpa-qa-gateway. Production's gateway lives on a different bridge and is not
# resolvable from here.
#
# WHEN QA GETS ITS OWN HOSTNAME + CERTIFICATE: see QA_DEPLOYMENT.md §9 — either
# front this port with the host nginx / a new server block, or copy the TLS
# blocks from default.conf into this file with the QA server_name and cert path.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Driver enrollment posts base64 face frames + ID documents in one JSON body,
    # which easily exceeds nginx's 1 MB default and 413s before reaching the
    # gateway. Allow generously for these multi-image uploads.
    client_max_body_size 25m;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Resolve `gateway` at request time via Docker's embedded DNS (127.0.0.11)
    # rather than caching it at startup. Using a variable in proxy_pass is what
    # forces per-request resolution, so a recreated gateway (new IP) is picked up
    # automatically without restarting nginx — no more post-deploy 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream gateway:8000;
    set $minio_upstream minio:9000;

    # MinIO reverse-proxy for browser-loadable driver-enrolment photos.
    # The gateway mints SigV4 presigned URLs against the public host
    # (MINIO_PUBLIC_ENDPOINT=<qa-host>:18080/minio); the browser then loads
    # http://<qa-host>:18080/minio/drivers/{object}?X-Amz-... via this block.
    # We strip the /minio prefix so MinIO receives /{bucket}/{object} — the exact
    # path the signature was computed over — and forward the ORIGINAL Host header
    # ($host, NOT minio:9000), because SigV4 signs the host too. Both must match
    # or MinIO answers SignatureDoesNotMatch. Don't buffer image bodies.
    location /minio/ {
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass http://$minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # WebSocket fan-out — must come before the generic /api block.
    location /api/ws {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # REST API + reports PDF.
    location /api/ {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # POC3 API reverse proxy
    location /poc3/ {
        rewrite ^/poc3/(.*)$ /$1 break;

        proxy_pass http://$gateway_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 60s;
    }

    # Cache hashed build assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Trucking-App PWA, mounted at /pwa ----
    # The service worker + manifest must never be long-cached, or clients get
    # stuck on a stale SW after a redeploy.
    location = /pwa/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /pwa/manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # The PWA bundles its own hashed assets under /pwa/assets/.
    location /pwa/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # PWA SPA fallback — any /pwa route serves the PWA shell (it hash-routes).
    location /pwa/ {
        try_files $uri $uri/ /pwa/index.html;
    }
    location = /pwa {
        return 301 /pwa/;
    }

    # SPA history fallback — every unknown route serves the dashboard index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
